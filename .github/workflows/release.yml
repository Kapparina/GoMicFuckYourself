name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WiX CLI
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2

      - name: Install WiX extensions
        shell: pwsh
        run: |
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2

      - name: Print checkout diagnostics
        shell: pwsh
        run: |
          Write-Host "Git ref: $env:GITHUB_REF"
          Write-Host "Git SHA: $env:GITHUB_SHA"
          git rev-parse HEAD
          Get-ChildItem -Name
          Test-Path .\GoMicFuckYourself.Agent\GoMicFuckYourself.Agent.csproj
          Test-Path .\App\App.csproj
          Test-Path .\GoMicFuckYourself.Installer\GoMicFuckYourself.Installer.csproj

      - name: Build installer
        shell: pwsh
        run: .\scripts\Build-Installer.ps1 -Configuration Release

      - name: Resolve MSI path
        id: resolve_msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path .\GoMicFuckYourself.Installer\bin\Release\net48\msi -Filter *.msi |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $msi) {
            throw "MSI output was not found."
          }

          "path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-msi
          path: ${{ steps.resolve_msi.outputs.path }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.resolve_msi.outputs.path }}
          generate_release_notes: true
